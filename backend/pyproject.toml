[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tether-api"
version = "0.1.0"
description = "Modular hospital management system API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.130",
    "uvicorn[standard]>=0.34,<0.40",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<0.33",
    "pydantic-settings>=2.7,<2.10",
    "argon2-cffi>=23.1,<26",
    "cryptography>=44,<47",
    "pyotp>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "aiosqlite>=0.21,<1",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[project.scripts]
tether-migrate-sqlite = "app.migrate_sqlite:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
